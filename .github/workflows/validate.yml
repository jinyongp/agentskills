name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.22"
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Install development dependencies
        run: uv sync --locked
      - name: Validate skill format and catalog
        run: uv run --locked python scripts/validate_skills.py
      - name: Test validation failures
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Check CLI discovery and installation
        run: uv run --locked python scripts/smoke_install.py
