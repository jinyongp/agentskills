name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'JS'
          const { version } = require('./package.json');
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must match package.json: v${version}`);
          }
          JS
      - name: Publish npm package
        uses: releaseway/npm-actions@680948414bbe6bfe64e94f776c3514ad44f3dd69 # v0.5.1

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Publish GitHub Release
        uses: releaseway/actions@5841e545ff259790a3b2461299e741d62c69a73d # v0.4.1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          prerelease: ${{ contains(github.ref_name, '-') }}
